upstream backup_api {
    server backup-api:6000;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backup_api/api/;
        proxy_set_header Host $host;
    }

    location /storage/ {
        proxy_pass http://minio:9001/;
        proxy_set_header Host $host;
    }

    location / {
        return 200 'Backup platform edge online';
        add_header Content-Type text/plain;
    }
}
