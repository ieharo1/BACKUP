services:
  backup-api:
    build: .
    container_name: backup-api
    restart: unless-stopped

  backup-scheduler:
    image: alpine:3.20
    container_name: backup-scheduler
    restart: unless-stopped
    command: ["sh", "/opt/scheduler.sh"]
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS}
    volumes:
      - ./scripts/scheduler.sh:/opt/scheduler.sh:ro

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: backup-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  backup-nginx:
    image: nginx:1.27-alpine
    container_name: backup-nginx
    restart: unless-stopped
    depends_on:
      - backup-api
      - minio
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  minio_data:
